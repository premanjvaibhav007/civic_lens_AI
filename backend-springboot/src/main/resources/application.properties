server.port=8080
spring.application.name=CivicLens-AI-Enterprise-Gateway

# Database configuration (Defaults to in-memory H2 with auto-schema creation; can be switched to PostgreSQL or SQLite)
spring.datasource.url=jdbc:h2:mem:civiclens;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for viewing database at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Python FastAPI AI Bridge URL (Spring Boot can proxy AI triage to FastAPI)
civiclens.fastapi.base-url=http://localhost:8000/api/v1
