version: '3.8'

services:
  # --- PostgreSQL 16 Database ---
  postgres:
    image: postgres:16-alpine
    container_name: civiclens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: civiclens
      POSTGRES_USER: civicadmin
      POSTGRES_PASSWORD: civiclens_secure_pg_password_2026!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicadmin -d civiclens"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civiclens-network

  # --- Redis 7 Cache & Task Queue ---
  redis:
    image: redis:7-alpine
    container_name: civiclens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civiclens-network

  # --- FastAPI Backend & AI Pipeline ---
  backend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
    container_name: civiclens-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://civicadmin:civiclens_secure_pg_password_2026!@postgres:5432/civiclens
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: civiclens_prod_jwt_super_secret_signing_key_replace_in_env_2026!
      ENVIRONMENT: production
      APP_NAME: "CivicLens AI"
      APP_VERSION: "2.0.0"
      STORAGE_LOCAL_ROOT: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - storage_uploads:/app/storage/uploads
      - storage_thumbs:/app/storage/thumbnails
    networks:
      - civiclens-network

  # --- React Authority Dashboard ---
  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.web
    container_name: civiclens-web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - civiclens-network

  # --- Prometheus Metrics Scraper ---
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: civiclens-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    networks:
      - civiclens-network

  # --- Grafana Visualization Dashboards ---
  grafana:
    image: grafana/grafana:10.4.0
    container_name: civiclens-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - civiclens-network

  # --- Nginx Edge Reverse Proxy ---
  nginx:
    image: nginx:alpine
    container_name: civiclens-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - web
    networks:
      - civiclens-network

networks:
  civiclens-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
  storage_uploads:
  storage_thumbs:
